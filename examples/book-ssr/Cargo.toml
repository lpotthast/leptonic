[package]
name = "book-ssr"
version = "0.1.0"
edition = "2024"

[package.metadata.leptos]
output-name = "book-ssr"
disable-erase-components = true
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "public"
site-addr = "127.0.0.1:4100"
reload-port = 4101
browserquery = "defaults"
watch = false
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-dev = "wasm-dev"
lib-profile-release = "wasm-release"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Consistent with workspace allows
must_use_candidate = "allow"
wildcard_imports = "allow"
module_name_repetitions = "allow"
# Leptos view macros generate let-bindings with unit value (e.g., <Route .../>)
let_unit_value = "allow"
# Leptos `#[server]` macros generate a client-side trait impl whose `async fn` never awaits
# (an item-level allow does not reach the generated impl)
unused_async_trait_impl = "allow"
# Demo pages are inherently long view functions
too_many_lines = "allow"
# Demo variables like range_a_step / range_b_step are intentionally similar
similar_names = "allow"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
hydrate = [
    "leptos/hydrate",
    "leptonic/hydrate",
    "leptos-element-capture/hydrate",
]
ssr = [
    "dep:axum",
    "dep:axum-server",
    "dep:htmd",
    "dep:markup5ever_rcdom",
    "dep:scraper",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:leptos_axum",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "leptonic/ssr",
    "leptonic/syntax-highlight",
    "leptos-element-capture/ssr",
]

[dependencies]
axum = { version = "0.8.8", optional = true }
axum-server = { version = "0.8.0", features = ["tls-rustls"], optional = true }
console_error_panic_hook = "0.1.7"
htmd = { version = "0.5.1", optional = true }
scraper = { version = "0.22", optional = true }
icondata = { version = "0.7.0", default-features = false, features = ["bootstrap-icons", "vs-code-icons"] }
indoc = "2.0.7"
leptonic = { path = "../../leptonic", features = ["hooks", "atoms", "components", "clipboard", "tiptap", "sanitize"] }
leptos-classes = "0.1.4"
leptos-element-capture = "0.1.0"
leptos = { version = "0.8.17", features = [] }
leptos-routes = "0.4.2"
leptos-styles = "0.1.0"
leptos-use = "0.19.2"
leptos_icons = "0.7.1"
leptos_axum = { version = "0.8.8", optional = true }
markup5ever_rcdom = { version = "0.38", optional = true }
leptos_meta = { version = "0.8.6", features = [] }
leptos_router = { version = "0.8.12", features = [] }
ordered-float = "5.1.0"
reqwest = { version = "0.13", default-features = false }
ringbuf = "0.4.8"
send_wrapper = "0.6"
serde = { version = "1", features = ["derive"] }
strum = { version = "0.27.2", features = ["derive"] }
tokio = { version = "1.51.1", features = ["rt-multi-thread", "signal"], optional = true }
tower = { version = "0.5.3", optional = true }
tower-http = { version = "0.6.8", features = ["full"], optional = true }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
tracing-wasm = "0.2.1"
wasm-bindgen = "0.2.117"
wasm-bindgen-futures = "0.4.64"
web-sys = { version = "0.3", features = ["Clipboard", "Navigator"] }
itertools = "0.14.0"

[dev-dependencies]
assertr = "0.7.1"
browser-test = "0.5.0"
leptos-browser-test = "0.3.0"
rootcause = "0.13.0"
serde_json = "1"
syn = { version = "2.0.117", features = ["full"] }
tokio = { version = "1.51.1", features = ["rt", "rt-multi-thread", "macros", "time"] }

[profile.dev.package.book-ssr]
# Line tables only (backtraces keep file:line): the book's full debug info is huge, exceeded the 4 GiB that 32-bit DWARF
# can address, and with `split-debuginfo = "unpacked"` piled up as new `.dwo` files on every build (rust#161824).
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 0
# No debug info for dependencies (including leptonic, a path dependency but not a member of this workspace): much
# smaller build directories and faster linking of the server and the wasm bundle.
debug = false

[profile.dev.package.syntect]
opt-level = 2

[profile.dev.package.fancy-regex]
opt-level = 2

[profile.dev.package.regex-automata]
opt-level = 2

[profile.dev.package.regex-syntax]
opt-level = 2

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[profile.wasm-dev]
inherits = "dev"
debug = false
strip = "symbols"

[profile.wasm-dev.package.book-ssr]
debug = false
strip = "symbols"

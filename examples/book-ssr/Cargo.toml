[profile.dev.package.leptonic]
# High optimization for our dependencies. This should decrease wasm-filesize and increase performance drastically
# whithout impacting our incremental compilation times.
# It will lead to obscure error messages from third party libraries though. So comment this out when seeing lib errors.
opt-level = 3

[profile.dev.package.syntect]
opt-level = 2

[profile.dev.package.fancy-regex]
opt-level = 2

[profile.dev.package.regex-automata]
opt-level = 2

[profile.dev.package.regex-syntax]
opt-level = 2

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

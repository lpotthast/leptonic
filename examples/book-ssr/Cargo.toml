[package]
name = "book-ssr"
version = "0.1.0"
edition = "2024"

[package.metadata.leptos]
output-name = "book-ssr"
disable-erase-components = true
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "public"
site-addr = "127.0.0.1:4100"
reload-port = 4101
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-dev = "wasm-dev"
lib-profile-release = "wasm-release"
bin-profile-dev = "server-dev"
# Content-hashed file names for the wasm, JS and CSS, which the server lets browsers cache for good (`src/main.rs`).
hash-files = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
hydrate = ["leptos/hydrate", "leptonic/hydrate", "leptos-element-capture/hydrate"]
ssr = [
    "dep:axum",
    "dep:axum-server",
    "dep:brotli",
    "dep:flate2",
    "dep:htmd",
    "dep:markup5ever_rcdom",
    "dep:rustls",
    "dep:scraper",
    "dep:tempfile",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:leptos_axum",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "leptonic/ssr",
    "leptonic/syntax-highlight",
    "leptos-element-capture/ssr",
    "leptos-use/ssr",
    # `use_cookie` reads the request's cookies on the server.
    "leptos-use/axum",
]

[dependencies]
axum = { version = "0.8.9", default-features = false, optional = true }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"], optional = true }
brotli = { version = "9.0.0", default-features = false, features = ["std"], optional = true }
codee = { version = "0.3.5", default-features = false }
console_error_panic_hook = { version = "0.1.7", default-features = false }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"], optional = true }
htmd = { version = "0.5.5", default-features = false, optional = true }
icondata = { version = "0.7.0", default-features = false, features = ["bootstrap-icons", "vs-code-icons"] }
indoc = { version = "2.0.7", default-features = false }
leptonic = { path = "../../leptonic", default-features = false, features = ["atoms", "clipboard", "intl-strings"] }
leptos = { version = "0.8.22", default-features = false }
leptos-classes = { version = "0.1.4", default-features = false }
leptos-element-capture = { version = "0.1.0", default-features = false }
leptos-routes = { version = "0.4.2", default-features = false }
leptos-use = { version = "0.19.2", default-features = false, features = [
    "signal_debounced",
    "use_document",
    "use_element_bounding",
    "use_element_size",
    "use_media_query",
    "use_resize_observer",
    "use_window",
    # The theme cookie: read by the server, so a page arrives in the reader's theme.
    "use_cookie",
] }
# leptos_axum gates its whole server integration (file serving, server functions) behind its `default` feature.
leptos_axum = { version = "0.8.10", default-features = false, features = ["default"], optional = true }
leptos_icons = { version = "0.7.1", default-features = false }
leptos_meta = { version = "0.8.7", default-features = false }
leptos_router = { version = "0.8.17", default-features = false }
markup5ever_rcdom = { version = "0.38", default-features = false, optional = true }
reqwest = { version = "0.13.5", default-features = false }
# TLS through ring (`main.rs` installs it): builds much faster than rustls' default provider, aws-lc-rs.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"], optional = true }
scraper = { version = "0.27.0", default-features = false, optional = true }
send_wrapper = { version = "0.6.0", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
tempfile = { version = "3.27.0", default-features = false, optional = true }
tokio = { version = "1.53.2", default-features = false, features = ["macros", "rt-multi-thread", "signal", "sync"], optional = true }
tower = { version = "0.5.3", default-features = false, features = ["util"], optional = true }
tower-http = { version = "0.7.1", default-features = false, features = ["compression-br", "compression-deflate", "compression-gzip"], optional = true }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "std"] }
tracing-wasm = { version = "0.2.1", default-features = false }
wasm-bindgen = { version = "0.2.129", default-features = false, features = ["std"] }
web-sys = { version = "0.3.106", default-features = false, features = [
    "std",
    "Element",
    "FormData",
    "HtmlElement",
    "HtmlFormElement",
] }

[dev-dependencies]
# The user's checkout, as in leptonic: eventual assertions (unreleased 0.8).
assertr = { path = "../../../assertr/assertr", default-features = false, features = ["std"] }
# The user's checkout, as in leptonic: 0.6.0 is unreleased (session reuse, Chrome Headless Shell, failure reports).
# `rustls-no-provider` + `rustls` with `ring` (installed in `tests/browser_test.rs`): Chrome for Testing downloads
# without compiling `aws-lc-rs`.
browser-test = { path = "../../../browser-test", default-features = false, features = ["rustls-no-provider"] }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
leptos-browser-test = { version = "0.3.0", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
syn = { version = "3.0.6", default-features = false, features = ["clone-impls", "full", "parsing"] }
tokio = { version = "1.53.2", default-features = false, features = ["macros", "rt-multi-thread", "time"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Consistent with workspace allows
must_use_candidate = "allow"
wildcard_imports = "allow"
module_name_repetitions = "allow"
# Leptos view macros generate let-bindings with unit value (e.g., <Route .../>)
let_unit_value = "allow"
# Leptos `#[server]` macros generate a client-side trait impl whose `async fn` never awaits
# (an item-level allow does not reach the generated impl)
unused_async_trait_impl = "allow"
# Demo pages are inherently long view functions
too_many_lines = "allow"
# Demo variables like range_a_step / range_b_step are intentionally similar
similar_names = "allow"

[profile.dev.package.book-ssr]
# Line tables only (backtraces keep file:line): the book's full debug info is huge, exceeded the 4 GiB that 32-bit DWARF
# can address, and with `split-debuginfo = "unpacked"` piled up as new `.dwo` files on every build (rust#161824).
debug = "line-tables-only"

# No `opt-level` here: `wasm-dev` inherits these overrides, and one for every package would override its `opt-level`.
[profile.dev.package."*"]
# No debug info for dependencies (including leptonic, a path dependency but not a member of this workspace): much
# smaller build directories and faster linking of the server and the wasm bundle.
debug = false

[profile.dev.package.syntect]
opt-level = 2

[profile.dev.package.fancy-regex]
opt-level = 2

[profile.dev.package.regex-automata]
opt-level = 2

[profile.dev.package.regex-syntax]
opt-level = 2

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[profile.server-dev]
inherits = "dev"
# Measured 2026-10-08 (124 pages): server-side rendering 82 ms per page in dev, 51 ms at `opt-level = 1`; rebuilds
# are faster, too (after a book change 79 s instead of 89 s, after a leptonic change 41 s instead of 56 s): less code to
# generate and link.
opt-level = 1

[profile.wasm-dev]
inherits = "dev"
# Measured 2026-10-08: 19.7 MB of wasm instead of 43.8 MB at opt-level 0; pages load faster (`just serve`, the browser
# tests). Rebuilds are no slower: after a book change 12-14s instead of 17-18s (wasm-bindgen handles the smaller
# file faster), after a leptonic change ~28s either way.
opt-level = "z"
debug = false
strip = "symbols"

[profile.wasm-dev.package.book-ssr]
debug = false
strip = "symbols"

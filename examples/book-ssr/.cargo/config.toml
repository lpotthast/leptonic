# `build.rustflags` come from the repository's `.cargo/config.toml`.

[target.aarch64-apple-darwin]
# Replaces `build.rustflags` on this target, so it repeats them.
rustflags = ["--cfg=web_sys_unstable_apis", "--cfg=erase_components", "-C", "link-arg=-fuse-ld=lld"]

[env]
LEPTOS_OUTPUT_NAME = "book-ssr"

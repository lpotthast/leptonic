[workspace]
resolver = "2"
members = ["leptonic", "leptonic-theme"]
exclude = ["examples", "testing"]

[workspace.package]
version = "0.5.0"

[workspace.dependencies]
leptonic = { path = "./leptonic", default-features = false }
leptonic_theme = { path = "./leptonic-theme", default-features = false }

[profile.dev.package."*"]
# No debug info for dependencies (the workspace members keep theirs): smaller build directories and faster linking.
debug = false

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(web_sys_unstable_apis)'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# overrides
doc_markdown = { level = "allow", priority = 1 }
float_cmp = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
module_name_repetitions = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
needless_pass_by_value = { level = "allow", priority = 1 }
option_if_let_else = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
used_underscore_binding = { level = "allow", priority = 1 }
wildcard_imports = { level = "allow", priority = 1 }

# TEMPORARY (2026-10-04): chrome-for-testing 0.4 can't parse the Chrome for Testing API since it
# started listing `linux-arm64`, which breaks browser-test 0.4. chrome-for-testing 0.5 fixes this.
# Remove this patch once a chrome-for-testing-manager release on chrome-for-testing 0.5 (and a
# browser-test release on it) is published. Requires `../chrome-for-testing-manager` checked out on
# branch `cft-0.5-linux-arm64`.
[patch.crates-io]
chrome-for-testing-manager = { path = "../chrome-for-testing-manager" }
# TEMPORARY (2026-10-05): session reuse, timing report and progress warnings of the browser test
# runner. Remove this patch once a browser-test release with them is published (and bump
# `browser-test` in `leptonic/Cargo.toml`). Requires `../browser-test` checked out on branch
# `session-reuse-timing`.
browser-test = { path = "../browser-test" }

[package]
name = "leptonic"
version = { workspace = true }
edition = "2024"
rust-version = "1.89.0"
authors = ["Lukas Potthast <privat@lukas-potthast.de>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/lpotthast/leptonic"
description = """
Accessible hooks and unstyled atoms for Leptos, ported from react-aria.
"""
categories = ["gui"]
keywords = ["leptos", "components", "component-library"]
build = "build.rs"

[package.metadata.docs.rs]
features = ["docsrs"]

[features]
default = ["hooks", "intl-strings"]

ssr = [
    "leptos/ssr",
    "leptos-use/ssr",
    "leptos-element-capture/ssr",
]
hydrate = ["leptos/hydrate", "leptos-element-capture/hydrate"]

# Core functionality. Hooks provide low level functions like `use_ress` which handle interactions, aria attributes and
# more. Use hooks to build your own components.
hooks = []

# Atoms are mostly unopinionated headless / unstyled Leptos components buily on top of hooks, basically making
# hook-usage easy from a Leptos app. All atoms render a single HTML element and are therefore easy to style and compose.
# Atoms allow you to build more complex component without requring too much knowledge about the underlying hooks.
atoms = ["hooks"]

# Enables clipboard support.
clipboard = ["hooks", "web-sys/Clipboard", "web-sys/ClipboardItem", "web-sys/BlobPropertyBag"]

# Syntax highlighting of source code into classed HTML (`utils::syntax_highlight`).
syntax-highlight = ["dep:syntect"]

# The hooks' messages (labels, descriptions, announcements) in react-aria's 34 locales. Without it,
# they are English (en-US) in every locale (a smaller wasm).
intl-strings = []

full = ["hooks", "atoms", "clipboard", "syntax-highlight", "intl-strings"]

nightly = ["leptos/nightly"]

# Disable the build script when running on docs.rs
docsrs = []

[dependencies]
atomic_enum = { version = "0.3.0", default-features = false }
cfg-if = { version = "1.0.5", default-features = false }
js-sys = { version = "0.3", default-features = false, features = ["std"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "js", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
leptos = { version = "0.8.22", default-features = false }
leptos-classes = { version = "0.1.4", default-features = false }
leptos-element-capture = { version = "0.1.0", default-features = false }
leptos-styles = { version = "0.1.0", default-features = false, features = ["typed-css"] }
leptos-use = { version = "0.19.2", default-features = false, features = ["use_document", "use_element_bounding", "use_element_size", "use_event_listener", "use_resize_observer", "use_window"] }
leptos_router = { version = "0.8.17", default-features = false }
send_wrapper = { version = "0.6.0", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
smallvec = { version = "1", default-features = false }
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
wasm-bindgen = { version = "0.2.129", default-features = false, features = ["std"] }
wasm-bindgen-futures = { version = "0.4.79", default-features = false, features = ["std"] }
web-sys = { version = "0.3.106", default-features = false, features = [
    "std",
    "Animation",
    "AnimationPlayState",
    "AnimationTimeline",
    "CssTransition",
    "DocumentTimeline",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "FocusEvent",
    "FocusEventInit",
    "FocusOptions",
    "HtmlCollection",
    "HtmlElement",
    "HtmlFormElement",
    "HtmlInputElement",
    "HtmlSlotElement",
    "HtmlStyleElement",
    "HtmlTextAreaElement",
    "KeyboardEventInit",
    "MouseEvent",
    "MouseEventInit",
    "PointerEventInit",
    "NodeFilter",
    "NodeList",
    "RadioNodeList",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "ScrollToOptions",
    "Selection",
    "ShadowRoot",
    "Storage",
    "SvgElement",
    "Touch",
    "TouchEvent",
    "TouchList",
    "TreeWalker",
    "ValidityState",
    "VisualViewport",
    "HtmlSelectElement",
    "Blob",
    "CustomEvent",
    "CustomEventInit",
    "ScrollBehavior",
    "ClipboardEvent",
    "CompositionEvent",
    "InputEvent",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "DragEvent",
    "File",
    "FileSystemDirectoryEntry",
    "FileSystemDirectoryReader",
    "FileSystemEntry",
    "FileSystemFileEntry",
    "MutationObserver",
    "MutationObserverInit",
    "MutationRecord",
] }
fixed_decimal = { version = "0.7", default-features = false }
icu_calendar = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_collator = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_datetime = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_decimal = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_list = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_locale = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_plurals = { version = "2.3", default-features = false, features = ["compiled_data"] }
# The Unicode general category (format characters, which the number parser ignores).
icu_properties = { version = "2.3", default-features = false, features = ["compiled_data"] }
# `Send + Sync` formatters (Arc instead of Rc in data payloads), so they can be cached in signals.
icu_provider = { version = "2.3", default-features = false, features = ["sync"] }
icu_time = { version = "2.3", default-features = false, features = ["compiled_data"] }
itertools = { version = "0.15.0", default-features = false, features = ["use_alloc"] }
syntect = { version = "5", optional = true, default-features = false, features = ["default-syntaxes", "html", "regex-fancy"] }
# `TryWriteable` output of ICU4X pattern formatting.
writeable = { version = "0.6", default-features = false }

[build-dependencies]
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
cargo_toml = { version = "1.0.1", default-features = false }
leptonic-theme = { version = "0.5", path = "../leptonic-theme", default-features = false }

[dev-dependencies]
# `testing::with_owner`: a thread-local executor for Effects. `tracing`: an Effect spawned before any
# executor is installed is dropped instead of panicking (tests without the helper).
any_spawner = { version = "0.3.0", default-features = false, features = ["tracing"] }
# The user's checkout: eventual assertions (`eventually`, `consistently`, `Patience`; unreleased 0.8).
assertr = { path = "../../assertr/assertr", default-features = false, features = ["std", "num"] }
# `rustls-no-provider` + `rustls` with `ring` (installed in `tests/browser_test.rs`): Chrome for Testing downloads
# without compiling `aws-lc-rs`.
browser-test = { path = "../../browser-test", default-features = false, features = ["rustls-no-provider"] }
futures = { version = "0.3.34", default-features = false, features = ["std", "executor"] }
# The user's checkout: `LeptosTestAppConfig::with_build_profile` (unreleased).
leptos-browser-test = { path = "../../leptos-browser-test", default-features = false }
# `effects`: Effects run in native unit tests (`testing::with_owner`); Leptos enables it only for csr/hydrate.
reactive_graph = { version = "0.2.15", default-features = false, features = ["effects"] }
rootcause = { version = "0.13.0", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
# The `thirtyfour` that `browser-test` re-exports, with Chrome DevTools access (`driver.cdp()`).
thirtyfour = { version = "0.37.5", default-features = false, features = ["cdp"] }
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "macros", "time"], default-features = false }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "ansi", "std"] }

[package.metadata.cargo-machete]
# Used for its `sync` feature only (ICU4X formatters cached in signals).
ignored = ["icu_provider"]

[lints]
workspace = true

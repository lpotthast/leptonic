[build]

# `web_sys_unstable_apis`: `leptonic` depends on some `leptos-use` functions requiring this opt-in. This may change in
# the future.
#
# `erase_components`: Leptos' type-erased views, as cargo-leptos uses in dev builds. Set here, for every build of the
# repository (also plain `cargo test`/`clippy` of the book and test app), so that all builds use identical flags and
# share compiled dependencies, and the book's debug info stays small (without it, 50x larger). The apps set
# cargo-leptos' `disable-erase-components` so that it doesn't add the flag a second time.
rustflags = ["--cfg=web_sys_unstable_apis", "--cfg=erase_components"]

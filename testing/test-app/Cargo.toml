[package]
name = "leptonic-test-app"
version = "0.1.0"
edition = "2024"

[package.metadata.leptonic]
# REQUIRED: Leptonic's build-script will copy the Leptonic themes to this directory.
style-dir = "style"

# REQUIRED: Leptonic's build-script will copy static JS dependencies to this directory.
js-dir = "public/js"

[package.metadata.leptos]
output-name = "leptonic-test-app"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "public"
site-addr = "127.0.0.1:4200"
reload-port = 4201
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
hydrate = ["leptos/hydrate", "leptonic/hydrate"]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:leptos_axum",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "leptonic/ssr",
]

[dependencies]
axum = { version = "0.8.8", optional = true }
console_error_panic_hook = "0.1.7"
leptonic = { path = "../../leptonic", features = ["full"] }
leptos = { version = "0.8.15", features = [] }
leptos_axum = { version = "0.8.7", optional = true }
leptos_meta = { version = "0.8.5", features = [] }
leptos_router = { version = "0.8.11", features = [] }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "signal"], optional = true }
tower = { version = "0.5.3", optional = true }
tower-http = { version = "0.6.8", features = ["compression-full"], optional = true }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
tracing-wasm = "0.2.1"
wasm-bindgen = "0.2.108"

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

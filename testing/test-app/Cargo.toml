[package]
name = "leptonic-test-app"
version = "0.1.0"
edition = "2024"

[package.metadata.leptos]
output-name = "leptonic-test-app"
disable-erase-components = true
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "public"
site-addr = "127.0.0.1:4200"
reload-port = 4201
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-dev = "wasm-dev"
lib-profile-release = "wasm-release"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
hydrate = ["leptos/hydrate", "leptonic/hydrate"]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "leptonic/ssr",
]

[dependencies]
axum = { version = "0.8.9", optional = true, default-features = false, features = ["http1", "tokio"] }
console_error_panic_hook = { version = "0.1.7", default-features = false }
leptonic = { path = "../../leptonic", default-features = false, features = ["atoms"] }
leptos = { version = "0.8.22", default-features = false }
leptos_axum = { version = "0.8.10", optional = true, default-features = false, features = ["default"] }
leptos_meta = { version = "0.8.7", default-features = false }
leptos_router = { version = "0.8.17", default-features = false }
tokio = { version = "1.53.2", optional = true, default-features = false, features = ["macros", "net", "rt-multi-thread"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "std", "ansi"] }
tracing-wasm = { version = "0.2.1", default-features = false }
wasm-bindgen = { version = "0.2.129", default-features = false, features = ["std"] }

[profile.dev.package."*"]
# No debug info for dependencies (including leptonic, a path dependency but not a member of this workspace): smaller
# build directories and faster linking of the server and the wasm bundle.
debug = false

[profile.wasm-dev]
inherits = "dev"

[profile.wasm-dev.package.leptonic-test-app]
debug = false
strip = "symbols"

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

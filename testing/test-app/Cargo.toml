[package]
name = "leptonic-test-app"
version = "0.1.0"
edition = "2024"

[package.metadata.leptos]
output-name = "leptonic-test-app"
disable-erase-components = true
site-root = "target/site"
site-pkg-dir = "pkg"
# Content-hashed file names for the wasm, JS and CSS, which the server lets browsers cache for good (`src/main.rs`), as
# a production server would: a test whose browser keeps its HTTP cache (browser-test's `SessionReset::Manual`) loads
# them, and the code compiled from them, from the cache.
hash-files = true
style-file = "style/main.scss"
assets-dir = "public"
site-addr = "127.0.0.1:4200"
reload-port = 4201
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
# The app is only built with `--release`, by the browser tests (`leptonic/tests/browser_test.rs`) and by
# `just serve-test-app`: an optimized wasm bundle loads and hydrates much faster in every test, and an optimized server
# renders pages faster (`server-release`).
lib-profile-release = "wasm-release"
bin-profile-release = "server-release"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
hydrate = ["leptos/hydrate", "leptonic/hydrate"]
ssr = [
    "dep:axum",
    "dep:http-body",
    "dep:tokio",
    "dep:leptos_axum",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "leptonic/ssr",
]

[dependencies]
axum = { version = "0.8.9", optional = true, default-features = false, features = ["http1", "tokio"] }
console_error_panic_hook = { version = "0.1.7", default-features = false }
# `TimeoutFuture`: a stand-in for a download in the clipboard fixture.
# `Frame`: the server wraps response bodies to know the request a panic while streaming happened in (`src/main.rs`).
http-body = { version = "1.0.1", optional = true, default-features = false }
# Performance fixtures (`src/pages/perf`): promises of the page's clock and tasks, results as JSON.
js-sys = { version = "0.3.106", default-features = false, features = ["std"] }
gloo-timers = { version = "0.4.0", default-features = false, features = ["futures"] }
# `metrics`: the hooks and atoms report that they ran, for the browser tests' measurements.
leptonic = { path = "../../leptonic", default-features = false, features = ["atoms", "clipboard", "intl-strings", "metrics"] }
# The metrics the browser tests measure; the app counts its own (`src/pages/perf/counters.rs`).
leptonic-perf-metrics = { path = "../perf-metrics" }
leptos = { version = "0.8.22", default-features = false }
leptos_axum = { version = "0.8.10", optional = true, default-features = false, features = ["default"] }
leptos_meta = { version = "0.8.7", default-features = false }
leptos_router = { version = "0.8.17", default-features = false }
# The reactive graph's work, counted by the performance fixtures (`src/pages/perf/counters.rs`).
reactive_graph = { version = "0.2.15", default-features = false, features = ["metrics"] }
# `DragPreview` holds its element in a `SendWrapper`.
send_wrapper = { version = "0.6.0", default-features = false }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
tokio = { version = "1.53.2", optional = true, default-features = false, features = ["macros", "net", "rt-multi-thread"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "std", "ansi"] }
tracing-wasm = { version = "0.2.1", default-features = false }
wasm-bindgen = { version = "0.2.129", default-features = false, features = ["std"] }
wasm-bindgen-futures = { version = "0.4.79", default-features = false, features = ["std"] }
# Shadow roots in the dialog fixture (`attachShadow`); the page's clock and tasks in the performance fixtures.
web-sys = { version = "0.3.106", default-features = false, features = [
    "MessageChannel",
    "MessagePort",
    "Performance",
    "ShadowRootInit",
    "ShadowRootMode",
] }

[patch.crates-io]
# `reactive_graph` with counters of its work (feature `metrics`, `reactive_graph::metrics`) for the performance
# fixtures, until upstream has them: the user's Leptos fork, checked out at `~/dev/leptos`, branch `leptonic-metrics`
# (v0.8.22 plus the counters). The crates it takes from its workspace come from there too, so that each exists once.
any_spawner = { path = "../../../leptos/any_spawner" }
hydration_context = { path = "../../../leptos/hydration_context" }
or_poisoned = { path = "../../../leptos/or_poisoned" }
reactive_graph = { path = "../../../leptos/reactive_graph" }
throw_error = { path = "../../../leptos/any_error" }

[profile.dev.package."*"]
# No debug info for dependencies (including leptonic, a path dependency but not a member of this workspace): smaller
# build directories and faster linking of the server (`server-release` inherits dev).
debug = false

[profile.wasm-release]
inherits = "release"
# Measured 2026-10-08 (821 browser tests, parallelism 8): `z` gives the smallest bundle (13 MB, dev: 33 MB) and the
# fastest runs (page loads 180ms, dev: 450ms; suite 1m 07s, dev: 1m 50s); opt-levels 1-3 and `s` were close. No LTO and
# the default codegen units: with `lto = true` and `codegen-units = 1`, a rebuild after a leptonic change took 84s
# instead of 20s (as fast as dev) for 1 MB less.
opt-level = "z"
incremental = true
# The tests check dev warnings and debug-only checks.
debug-assertions = true
overflow-checks = true

[profile.server-release]
inherits = "dev"
# Measured 2026-10-08: server-side rendering 6x faster than in dev (1.8 ms per fixture page instead of 11 ms, the
# calendar page 87 ms instead of 550 ms), with no slower rebuilds (24 s after a leptonic change, dev: 26 s).
opt-level = 1

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Components return views, which are no `#[must_use]` candidates (as in the workspace and the book)
must_use_candidate = "allow"
# Fixture pages are long view functions (as in the workspace and the book)
too_many_lines = "allow"
